name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password-for-ephemeral-tests
          POSTGRES_DB: lumio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumio"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Synthetic credentials for these disposable CI services only.
      ADMIN_DATABASE_URL: postgresql://postgres:ci-admin-password-for-ephemeral-tests@127.0.0.1:5432/lumio
      MIGRATION_DATABASE_URL: postgresql://lumio_migrator:ci-migration-password-for-ephemeral-tests@127.0.0.1:5432/lumio
      DATABASE_URL: postgresql://lumio_app:ci-runtime-password-for-ephemeral-tests@127.0.0.1:5432/lumio
      BETTER_AUTH_SECRET: synthetic-ci-auth-secret-for-ephemeral-tests-only
      APP_URL: http://127.0.0.1:3100
      LUMIO_LOCAL_TEST: '1'
      MAIL_TRANSPORT: smtp
      SMTP_HOST: 127.0.0.1
      EMAIL_FROM: lumio@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:provision
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
